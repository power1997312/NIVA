# =====================================================================
# 部件用例库 · 通用探针模板（兜底）
# =====================================================================
# 定位：当图纸上的块类型在库中**既无精确命中也无同族命中**时，
#       以本模板兜底生成一个"最小可用"的探针用例，保证流程不中断。
#
# ★ 纪律（架构方案 §4.10）：
#   - 探针用例必须显式标注 probe=true 与降级原因，**不得冒充专用用例**；
#   - 探针的期望结果只允许"定性响应"，不含任何具体数值；
#   - 评审回流后应优先把高频未命中类型补成专用模板，而不是长期依赖探针。
# =====================================================================
schema_version: "1.0"
lib_version: "0.1.0"
updated: "2026-09-10"
probe: true
source_note: "通用探针兜底模板（cls=* 通配，仅当无精确/同族命中时使用）"

cases:
  - case_id: GEN-PROBE-001
    cls: "*"
    domain: MIXED
    applies_when:
      params: {}
      ports: {in: {min: 0, max: null}, out: {min: 0, max: null}}
      stateful: null
    principle: "通用探针：验证该块在输入发生变化时输出按其图纸标注语义产生相应响应（定性）"
    generation: template
    coverage: [equivalence_class]
    standard_ref: "IEC 60880 §6.3（通用功能验证）"
    step_template: |
      1. 记录 {block_label} 在当前工况下的输入与输出
      2. 逐路改变其输入（在信号量程内），观察 {output_tag} 的响应方向
      3. 恢复原工况，确认输出恢复
    expected_template: "输出随输入按图纸标注语义产生对应方向的响应（定性判断，不含数值判据）"
    evidence_hint: "节点 {block_id} 的图纸标注、输入输出端口清单、所在页与包围盒"
    safety_notes: "本用例为通用探针兜底产物：未命中专用模板，覆盖度有限且无定量判据，**必须由领域专家补充完善后方可作为正式验证依据**。"
